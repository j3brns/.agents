name: Update Ten Tors Route I data

on:
  workflow_dispatch:
    inputs:
      force_image_refresh:
        description: 'Refresh cached checkpoint images'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  repository_dispatch:
    types: [ten-tors-route-i-update]
  schedule:
    - cron: '*/5 5-20 9,10 5 *'

permissions:
  contents: write

concurrency:
  group: ten-tors-route-i-data
  cancel-in-progress: true

env:
  UPDATE_WINDOW_START: '2026-05-09T06:00:00+01:00'
  UPDATE_WINDOW_END: '2026-05-10T21:00:00+01:00'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check daylight weekend update window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          now_epoch=$(TZ=Europe/London date +%s)
          start_epoch=$(date -d "$UPDATE_WINDOW_START" +%s)
          end_epoch=$(date -d "$UPDATE_WINDOW_END" +%s)
          if [ "$now_epoch" -ge "$start_epoch" ] && [ "$now_epoch" -le "$end_epoch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          ref: main
          path: source

      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          ref: gh-pages
          path: pages

      - uses: actions/setup-node@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: '20'

      - name: Fetch and parse Ten Tors data
        if: steps.window.outputs.allowed == 'true'
        working-directory: source
        env:
          OUTPUT: ../pages/ten-tors-route-i/data.json
          EXISTING_DATA: ../pages/ten-tors-route-i/data.json
          IMAGE_OUTPUT_DIR: ../pages/ten-tors-route-i/images
          IMAGE_PUBLIC_PATH: ./images
          FORCE_IMAGE_REFRESH: ${{ github.event.inputs.force_image_refresh || 'false' }}
        run: node scripts/update-ten-tors-route-i.mjs

      - name: Commit updated JSON/images to gh-pages
        if: steps.window.outputs.allowed == 'true'
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ten-tors-route-i/data.json ten-tors-route-i/images
          if git diff --cached --quiet; then
            echo "No Ten Tors data/image changes to commit."
          else
            git commit -m "Update Ten Tors Route I dashboard data"
            git push
          fi
