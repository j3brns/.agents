name: Update Ten Tors Route I data

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - ten-tors-route-i-update
  schedule:
    # Limited operating window for this weekend only.
    # UK daylight window: 06:00-21:00 Europe/London.
    # In May, BST is UTC+1, so this is 05:00-20:59 UTC.
    # This schedule is deliberately date-bound to 9-10 May.
    - cron: '*/5 5-20 9,10 5 *'

permissions:
  contents: write

concurrency:
  group: ten-tors-route-i-data
  cancel-in-progress: true

env:
  # Defensive gate: even repository_dispatch and manual runs will not update JSON
  # outside this operational window unless this workflow is edited.
  UPDATE_WINDOW_START: '2026-05-09T06:00:00+01:00'
  UPDATE_WINDOW_END: '2026-05-10T21:00:00+01:00'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check daylight weekend update window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          now_epoch=$(TZ=Europe/London date +%s)
          start_epoch=$(date -d "$UPDATE_WINDOW_START" +%s)
          end_epoch=$(date -d "$UPDATE_WINDOW_END" +%s)
          now_local=$(TZ=Europe/London date --iso-8601=seconds)

          echo "Local time: $now_local"
          echo "Allowed window: $UPDATE_WINDOW_START to $UPDATE_WINDOW_END"

          if [ "$now_epoch" -ge "$start_epoch" ] && [ "$now_epoch" -le "$end_epoch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Inside update window."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Outside update window. Skipping data update."
          fi

      - name: Check out source branch
        if: steps.window.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Check out GitHub Pages branch
        if: steps.window.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Set up Node.js
        if: steps.window.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and parse Ten Tors data
        if: steps.window.outputs.allowed == 'true'
        working-directory: source
        env:
          OUTPUT: ../pages/ten-tors-route-i/data.json
        run: node scripts/update-ten-tors-route-i.mjs

      - name: Commit updated JSON to gh-pages
        if: steps.window.outputs.allowed == 'true'
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ten-tors-route-i/data.json
          if git diff --cached --quiet; then
            echo "No Ten Tors data changes to commit."
          else
            git commit -m "Update Ten Tors Route I data"
            git push
          fi
