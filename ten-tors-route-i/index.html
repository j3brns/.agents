<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ten Tors Route I — Joanna B</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#020617;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 10%,#065f46,transparent 30%),radial-gradient(circle at 85% 5%,#075985,transparent 28%),linear-gradient(#020617,#0f172a 50%,#052e16)}.wrap{max-width:1180px;margin:auto;padding:14px 12px 28px}.hero,.panel,.metric,.current{border:1px solid rgba(255,255,255,.14);background:rgba(15,23,42,.84);box-shadow:0 24px 70px rgba(0,0,0,.32);backdrop-filter:blur(16px)}.hero{border-radius:32px;overflow:hidden}.heroArt{position:relative;min-height:320px;background:linear-gradient(135deg,#dbeafe,#bfdbfe 45%,#f8fafc)}.heroArt svg{position:absolute;inset:0;width:100%;height:100%;display:block}.heroText{position:relative;z-index:2;margin-left:auto;max-width:480px;min-height:320px;display:flex;flex-direction:column;justify-content:end;padding:26px;text-align:right;background:linear-gradient(90deg,transparent,rgba(255,255,255,.72));color:#0f172a}.heroText h1{font-size:clamp(42px,9vw,76px);line-height:.9;letter-spacing:-.055em;margin:0}.heroText p{margin:10px 0 0;color:#334155}.pill{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#e2e8f0;margin:0 6px 8px 0}.heroText .pill{background:rgba(15,23,42,.08);border-color:rgba(15,23,42,.18);color:#0f172a}.good{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.16);color:#d1fae5}.heroText .good{color:#065f46}.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.16);color:#92400e}.btn{min-height:44px;border:1px solid rgba(15,23,42,.18);border-radius:999px;background:rgba(15,23,42,.10);color:#0f172a;padding:11px 16px;font:inherit;font-weight:850}.metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.metric{border-radius:22px;padding:14px}.metric small,.stat small,.current small{display:block;color:#94a3b8;text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:10px}.metric b{display:block;font-size:21px;margin-top:5px}.metric span{color:#cbd5e1;font-size:12px}.panel{border-radius:28px;padding:clamp(16px,3vw,24px);margin-top:16px}h2{margin:0 0 5px}.sub{color:#94a3b8;margin:0 0 16px}.map{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:radial-gradient(circle at 30% 25%,rgba(52,211,153,.2),transparent 35%),linear-gradient(135deg,#0f172a,#1f2937,#14532d);padding:10px}svg{width:100%;height:auto}.current{margin-top:16px;border-radius:28px;padding:18px;display:grid;grid-template-columns:1fr repeat(3,auto);gap:16px;align-items:center;background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(255,255,255,.06));border-color:rgba(52,211,153,.35)}.current h2{font-size:clamp(28px,6vw,44px);margin:0}.current b{font-size:18px}.bar{height:9px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#34d399}.timeline{display:grid;gap:11px;margin-top:16px}.row{display:grid;grid-template-columns:34px 1fr 58px;gap:9px;align-items:center}.row.currentRow{display:none}.dot{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#94a3b8;font-weight:900}.dot.on{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.7);color:#d1fae5}.row strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row em{font-style:normal;color:#94a3b8;font-size:11px}.time{text-align:right}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px}.card{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:22px;overflow:hidden}.card.now{border-color:rgba(52,211,153,.75)}.card.next{border-color:rgba(125,211,252,.7)}.img{height:132px;background:linear-gradient(135deg,#0f172a,#14532d);overflow:hidden}.img img{width:100%;height:100%;object-fit:cover;opacity:.84}.body{padding:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:14px;padding:8px}.stat b{font-size:12px}.notice{margin-bottom:16px;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}footer{text-align:center;color:#64748b;font-size:12px;padding:22px}.spin{width:50px;height:50px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#34d399;animation:spin .9s linear infinite;margin:20vh auto 16px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:860px){.metricGrid{grid-template-columns:repeat(2,1fr)}.current{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.heroText{text-align:left;margin:0;max-width:none;background:linear-gradient(0deg,rgba(255,255,255,.72),transparent)}}@media(max-width:560px){.hero,.panel,.current{border-radius:24px}.heroArt,.heroText{min-height:420px}.metricGrid,.current,.cards{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 54px}.dot{width:29px;height:29px}.img{height:160px}}</style></head><body><div id="root"><div class="spin"></div><p style="text-align:center;color:#cbd5e1">Loading Route I JSON…</p></div><script>const APP_VERSION='v0.4.4',REFRESH=60000,DATA_URL='./data.json';const FALL='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f172a"/><stop offset=".55" stop-color="#14532d"/><stop offset="1" stop-color="#052e16"/></linearGradient></defs><rect width="900" height="500" fill="url(#g)"/><path d="M0 380 L150 250 L260 330 L410 180 L570 350 L720 230 L900 370 L900 500 L0 500 Z" fill="#1f2937" opacity=".88"/><text x="54" y="430" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="38" font-weight="700">Dartmoor route image unavailable</text></svg>');let S={d:null,err:null,checked:null,updating:false};function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function mins(t){if(!/^\d{1,2}:\d{2}$/.test(t||''))return null;let[a,b]=t.split(':').map(Number);return a*60+b}function fmtElapsed(c){if(c?.elapsed?.label)return c.elapsed.label;let start=S.d?.checkpoints?.[0]?.arrivalTime,a=mins(start),b=mins(c?.arrivalTime);if(a==null||b==null)return'—';let d=Math.max(0,b-a),h=Math.floor(d/60),m=d%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`}function ago(t){let x=mins(t);if(x==null)return'—';let n=new Date(),s=new Date(n);s.setHours(Math.floor(x/60),x%60,0,0);let d=Math.floor((n-s)/60000);if(d<0)return'later today';if(d<1)return'<1m ago';let h=Math.floor(d/60),m=d%60;return h?`${h}h ${m}m ago`:`${d}m ago`}async function load(){if(S.updating)return;S.updating=true;if(S.d)render();try{let r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);S.d=await r.json();S.err=null}catch(x){S.err='Could not load generated data.json: '+x.message}finally{S.checked=new Date();S.updating=false;render()}}function imageUrl(c){return c.localImageUrl||c.imageUrl||c.thumbnailUrl||FALL}function pill(t,c=''){return`<span class="pill ${c}">${esc(t)}</span>`}function metric(l,v,d){return`<div class="metric"><small>${esc(l)}</small><b>${esc(v)}</b><span>${esc(d)}</span></div>`}function heroSvg(){return`<svg viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset=".55" stop-color="#bfdbfe"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient><linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2c48d"/><stop offset=".5" stop-color="#b77942"/><stop offset="1" stop-color="#6b3f24"/></linearGradient></defs><rect width="1200" height="520" fill="url(#sky)"/><g opacity=".55" fill="#334155"><rect x="705" y="160" width="38" height="190" rx="4"/><rect x="760" y="120" width="58" height="230" rx="4"/><rect x="900" y="105" width="70" height="245" rx="4"/><rect x="1060" y="90" width="72" height="260" rx="4"/></g><path d="M0 465 C200 430 390 450 590 422 C835 388 1010 430 1200 390 L1200 520 L0 520 Z" fill="#0f766e" opacity=".38"/><g transform="translate(110 45)"><path d="M286 77 C210 55 135 94 113 170 C89 254 140 326 116 427 L292 427 C280 362 322 313 324 239 C327 151 348 96 286 77 Z" fill="url(#hair)"/><path d="M295 126 C242 92 184 119 166 179 C150 232 171 286 214 310 C250 330 296 315 318 280 C348 233 341 157 295 126 Z" fill="#f3c6a5"/><path d="M250 207 C273 205 292 213 305 226" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/><path d="M312 246 C299 260 281 263 263 255" fill="none" stroke="#9f6758" stroke-width="4" stroke-linecap="round"/><path d="M314 163 C356 162 390 183 410 218" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round"/><path d="M330 150 C365 147 401 159 430 183" fill="none" stroke="#1f2937" stroke-width="15" stroke-linecap="round"/><path d="M170 155 C128 260 158 375 108 430 L246 430 C228 340 277 257 250 178 C235 133 195 126 170 155 Z" fill="url(#hair)"/><path d="M110 430 L330 430 L356 520 L60 520 Z" fill="#581c87"/></g></svg>`}function mapSvg(cps){let lat=cps.map(x=>x.coordinates.lat),lon=cps.map(x=>x.coordinates.lon),mnla=Math.min(...lat),mxla=Math.max(...lat),mnlo=Math.min(...lon),mxlo=Math.max(...lon),cur=S.d.currentCheckpoint?.name,pts=cps.map(x=>({...x,x:8+(x.coordinates.lon-mnlo)/(mxlo-mnlo||1)*84,y:92-(x.coordinates.lat-mnla)/(mxla-mnla||1)*84})),p=pts.map(x=>`${x.x},${x.y}`).join(' '),rp=pts.filter(x=>x.reached).map(x=>`${x.x},${x.y}`).join(' ');return`<div class="map"><svg viewBox="0 0 100 100"><polyline points="${p}" fill="none" stroke="rgba(226,232,240,.35)" stroke-width="1.5" stroke-dasharray="2 2"/><polyline points="${rp}" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>${pts.map((x,i)=>`<g><circle cx="${x.x}" cy="${x.y}" r="${x.name===cur?2.5:1.5}" fill="${x.reached?'#34d399':'#cbd5e1'}" stroke="#020617" stroke-width=".6"/>${(i===0||i===pts.length-1||x.name===cur)?`<text x="${x.x+2}" y="${x.y-2}" font-size="2.5" fill="white" font-weight="800">${esc(x.name)}</text>`:''}</g>`).join('')}</svg></div>`}function render(){if(!S.d){document.getElementById('root').innerHTML=`<main class="wrap"><section class="panel notice"><h2>Data not available</h2><p class="sub">${esc(S.err||'Waiting for generated JSON.')}</p><button class="btn" onclick="load()">⟳ Try again</button> ${pill(APP_VERSION)}</section></main>`;return}let d=S.d,cur=d.currentCheckpoint,next=d.nextCheckpoint,checked=S.checked?S.checked.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—',gen=d.generatedAt?new Date(d.generatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';document.getElementById('root').innerHTML=`<main class="wrap">${S.err?`<section class="panel notice"><h2>Connection note</h2><p class="sub">${esc(S.err)} Existing data remains on screen.</p></section>`:''}<section class="hero"><div class="heroArt">${heroSvg()}<div class="heroText"><div>${pill('Route I','good')}${pill('Code '+d.team.code)}${pill(APP_VERSION)}${pill(S.updating?'Updating':'Idle',S.updating?'warn':'good')}</div><h1>Joanna B</h1><p>${esc(d.team.sourceName)} · source ${esc(d.sourceLastUpdated)} · checked ${esc(checked)}</p><p><button class="btn" onclick="load()" ${S.updating?'disabled':''}>⟳ Refresh now</button></p></div></div></section><section class="metricGrid">${metric('Current position',cur?.name||'—',cur?.arrivalTime?'Arrived '+cur.arrivalTime:'No checkpoint yet')}${metric('Next checkpoint',next?next.name:'Finish reached',next?next.progressPercent+'% route marker':'Route complete')}${metric('Since last checkpoint',ago(cur?.arrivalTime),'Calculated locally')}${metric('JSON generated',gen,'Last checked '+checked)}</section><section class="panel"><h2>🧭 Stylised Route I map</h2><p class="sub">Coordinate-projected path, not a navigation map.</p>${mapSvg(d.checkpoints)}</section><section class="current"><div><small>Current checkpoint</small><h2>${esc(cur?.name||'—')}</h2></div><div><small>Arrival</small><b>${esc(cur?.arrivalTime||'—')}</b></div><div><small>Elapsed</small><b>${esc(fmtElapsed(cur))}</b></div><div><small>Next</small><b>${esc(next?next.name:'Finish reached')}</b></div></section><section class="panel"><h2>📍 Progress timeline</h2><p class="sub">${d.routeProgressPercent}% complete by checkpoint count.</p><div class="bar"><i style="width:${d.routeProgressPercent}%"></i></div><div class="timeline">${d.checkpoints.map((c,i)=>`<div class="row ${c.name===cur?.name?'currentRow':''}"><div class="dot ${c.reached?'on':''}">${c.reached?'✓':i+1}</div><div><strong>${esc(c.name)}</strong><br><em>${c.progressPercent}% · ${esc(fmtElapsed(c))}</em></div><div class="time"><strong>${esc(c.arrivalTime||'—')}</strong></div></div>`).join('')}</div></section><section class="panel"><h2>⛰️ Checkpoints</h2><p class="sub">Images are supplied by data.json where available, with an embedded fallback.</p><div class="cards">${d.checkpoints.map(c=>`<article class="card ${c.name===cur?.name?'now':next&&c.name===next.name?'next':''}"><div class="img"><img src="${esc(imageUrl(c))}" alt="" loading="lazy" onerror="this.onerror=null;this.src=FALL"></div><div class="body"><h3>${esc(c.name)}</h3><div class="stats"><div class="stat"><small>Arrival</small><b>${esc(c.arrivalTime||'—')}</b></div><div class="stat"><small>Elapsed</small><b>${esc(fmtElapsed(c))}</b></div><div class="stat"><small>Route</small><b>${c.progressPercent}%</b></div></div></div></article>`).join('')}</div></section><footer>Source: Ten Tors Route I event data. JSON generated by GitHub Actions. Page ${APP_VERSION}. Coordinates are approximate.</footer></main>`}window.load=load;load();setInterval(load,REFRESH);</script></body></html>
