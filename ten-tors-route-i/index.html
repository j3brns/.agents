<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#052e16">
<title>Ten Tors Route I — Polar Explorer Scouts</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f8fafc;background:#020617}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 10%,#065f46 0,transparent 30%),radial-gradient(circle at 85% 5%,#075985 0,transparent 28%),linear-gradient(#020617,#0f172a 50%,#052e16);color:#f8fafc}.wrap{max-width:1180px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.hero,.panel{border:1px solid rgba(255,255,255,.14);background:rgba(15,23,42,.84);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(16px)}.hero{border-radius:32px;padding:clamp(20px,5vw,40px);overflow:hidden;position:relative}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(52,211,153,.35),transparent 33%),repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 1px,transparent 1px 18px);pointer-events:none}.hero>*{position:relative}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:end}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.pill{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;display:inline-flex;align-items:center}.good{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.14);color:#d1fae5}.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.13);color:#fef3c7}h1{font-size:clamp(34px,8vw,68px);line-height:.98;letter-spacing:-.055em;margin:0}.lead{font-size:clamp(15px,2.2vw,18px);line-height:1.6;color:#e2e8f0;max-width:720px}.btn{min-height:44px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.1);color:white;padding:11px 16px;font:inherit;font-weight:850}.btn[disabled]{opacity:.62}.metrics{display:grid;gap:12px}.metric{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:22px;padding:14px}.metric small{color:#94a3b8;text-transform:uppercase;letter-spacing:.18em;font-weight:900}.metric b{display:block;font-size:21px;margin-top:5px}.metric span{color:#cbd5e1;font-size:12px}.cols{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:16px}.panel{border-radius:28px;padding:clamp(16px,3vw,24px)}h2{margin:0 0 5px}.sub{color:#94a3b8;margin:0 0 16px}.map{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:radial-gradient(circle at 30% 25%,rgba(52,211,153,.2),transparent 35%),linear-gradient(135deg,#0f172a,#1f2937,#14532d);padding:10px}svg{width:100%;height:auto;display:block}.bar{height:9px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#34d399;width:0;transition:width .6s}.timeline{display:grid;gap:11px}.row{display:grid;grid-template-columns:34px 1fr 58px;gap:9px;align-items:center}.dot{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#94a3b8;font-weight:900}.dot.on{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.7);color:#d1fae5}.row strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row em{font-style:normal;color:#94a3b8;font-size:11px}.time{text-align:right}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px}.card{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:22px;overflow:hidden}.card.now{border-color:rgba(52,211,153,.75)}.card.next{border-color:rgba(125,211,252,.7)}.img{height:132px;background:#111827;position:relative}.img img{width:100%;height:100%;object-fit:cover;opacity:.84}.body{padding:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:14px;padding:8px}.stat small{font-size:8px;color:#94a3b8;text-transform:uppercase;letter-spacing:.12em}.stat b{display:block;font-size:12px}.notice{margin-bottom:16px;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}footer{text-align:center;color:#64748b;font-size:12px;padding:22px}.spin{width:50px;height:50px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#34d399;animation:spin .9s linear infinite;margin:20vh auto 16px}.tinyspin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#d1fae5;animation:spin .8s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:860px){.grid,.cols{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{border-radius:24px}.metrics,.cards{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 54px}.dot{width:29px;height:29px}.img{height:160px}.stat{padding:7px}}
</style>
</head>
<body>
<div id="root"><div class="spin"></div><p style="text-align:center;color:#cbd5e1">Loading Route I JSON…</p></div>
<script>
const APP_VERSION='v0.4.1';
const REFRESH=60000;
const DATA_URL='./data.json';
const FALL='https://commons.wikimedia.org/wiki/Special:FilePath/Dartmoor%20view%20from%20Haytor.jpg?width=900';
let S={d:null,imgs:{},err:null,checked:null,updating:false,source:'generated JSON'};
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function mins(t){if(!/^\d{1,2}:\d{2}$/.test(t||''))return null;let[a,b]=t.split(':').map(Number);return a*60+b}
function fmtElapsed(c){if(c?.elapsed?.label)return c.elapsed.label;let start=S.d?.checkpoints?.[0]?.arrivalTime,a=mins(start),b=mins(c?.arrivalTime);if(a==null||b==null)return'—';let d=Math.max(0,b-a),h=Math.floor(d/60),m=d%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`}
function ago(t){let x=mins(t);if(x==null)return'—';let n=new Date(),s=new Date(n);s.setHours(Math.floor(x/60),x%60,0,0);let d=Math.floor((n-s)/60000);if(d<0)return'later today';if(d<1)return'<1m ago';let h=Math.floor(d/60),m=d%60;return h?`${h}h ${m}m ago`:`${d}m ago`}
async function load(){if(S.updating)return;S.updating=true;if(S.d)render();try{let r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);S.d=await r.json();S.err=null;S.source='generated JSON'}catch(x){S.err='Could not load generated data.json: '+x.message}finally{S.checked=new Date();S.updating=false;render();if(S.d)loadImages()}}
async function img(cp){if(S.imgs[cp.name])return;let c=cp.coordinates,p=new URLSearchParams({action:'query',generator:'geosearch',ggscoord:c.lat+'|'+c.lon,ggsradius:'6000',ggslimit:'6',prop:'pageimages',pithumbsize:'700',format:'json',origin:'*'});try{let r=await fetch('https://commons.wikimedia.org/w/api.php?'+p),j=await r.json(),pg=Object.values(j?.query?.pages||{});S.imgs[cp.name]=pg.find(x=>x.thumbnail)?.thumbnail.source||FALL}catch{S.imgs[cp.name]=FALL}}
async function loadImages(){await Promise.all(S.d.checkpoints.map(img));render()}
function pill(t,c=''){return`<span class="pill ${c}">${t==='Updating'?'<span class="tinyspin"></span>':''}${esc(t)}</span>`}
function metric(l,v,d){return`<div class="metric"><small>${esc(l)}</small><b>${esc(v)}</b><span>${esc(d)}</span></div>`}
function map(cps){let lat=cps.map(x=>x.coordinates.lat),lon=cps.map(x=>x.coordinates.lon),mnla=Math.min(...lat),mxla=Math.max(...lat),mnlo=Math.min(...lon),mxlo=Math.max(...lon),cur=S.d.currentCheckpoint?.name,pts=cps.map(x=>({...x,x:8+(x.coordinates.lon-mnlo)/(mxlo-mnlo||1)*84,y:92-(x.coordinates.lat-mnla)/(mxla-mnla||1)*84})),p=pts.map(x=>`${x.x},${x.y}`).join(' '),rp=pts.filter(x=>x.reached).map(x=>`${x.x},${x.y}`).join(' ');return`<div class="map"><svg viewBox="0 0 100 100"><polyline points="${p}" fill="none" stroke="rgba(226,232,240,.35)" stroke-width="1.5" stroke-dasharray="2 2"/><polyline points="${rp}" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>${pts.map((x,i)=>`<g><circle cx="${x.x}" cy="${x.y}" r="${x.name===cur?2.5:1.5}" fill="${x.reached?'#34d399':'#cbd5e1'}" stroke="#020617" stroke-width=".6"/>${(i===0||i===pts.length-1||x.name===cur)?`<text x="${x.x+2}" y="${x.y-2}" font-size="2.5" fill="white" font-weight="800">${esc(x.name)}</text>`:''}</g>`).join('')}</svg></div>`}
function render(){if(!S.d){document.getElementById('root').innerHTML=`<main class="wrap"><section class="panel notice"><h2>Data not available</h2><p class="sub">${esc(S.err||'Waiting for generated JSON.')}</p><button class="btn" onclick="load()">⟳ Try again</button> ${pill(APP_VERSION)}</section></main>`;return}let d=S.d,cur=d.currentCheckpoint,next=d.nextCheckpoint,checked=S.checked?S.checked.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—',gen=d.generatedAt?new Date(d.generatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';document.getElementById('root').innerHTML=`<main class="wrap">${S.err?`<section class="panel notice"><h2>Connection note</h2><p class="sub">${esc(S.err)} Existing data remains on screen.</p></section>`:''}<section class="hero"><div class="grid"><div><div class="pills">${pill('Route I live tracker','good')}${pill('Code '+d.team.code)}${pill(APP_VERSION)}${pill(S.updating?'Updating':'Idle',S.updating?'warn':'good')}${pill('Source updated '+d.sourceLastUpdated)}${pill('Checked '+checked)}</div><h1>${esc(d.team.sourceName)} across Dartmoor</h1><p class="lead">Mobile-focused dashboard for Polar Explorer Scouts, team code IF. The page dynamically polls local JSON generated by GitHub Actions, so updates do not blank or flash the screen.</p><p><button class="btn" onclick="load()" ${S.updating?'disabled':''}>⟳ Refresh now</button> ${pill('JSON poll every 60s')} ${pill('Data: '+S.source)}</p></div><div class="metrics">${metric('Current position',cur?.name||'—',cur?.arrivalTime?'Arrived '+cur.arrivalTime:'No checkpoint yet')}${metric('Next checkpoint',next?next.name:'Finish reached',next?next.progressPercent+'% route marker':'Route complete')}${metric('Since last checkpoint',ago(cur?.arrivalTime),'Calculated locally')}${metric('JSON generated',gen,'Last checked '+checked)}</div></div></section><div class="cols"><section class="panel"><h2>🧭 Stylised Route I map</h2><p class="sub">Coordinate-projected path, not a navigation map.</p>${map(d.checkpoints)}</section><section class="panel"><h2>📍 Progress timeline</h2><p class="sub">${d.routeProgressPercent}% complete by checkpoint count.</p><div class="bar"><i style="width:${d.routeProgressPercent}%"></i></div><div class="timeline" style="margin-top:16px">${d.checkpoints.map((c,i)=>`<div class="row"><div class="dot ${c.reached?'on':''}">${c.reached?'✓':i+1}</div><div><strong>${esc(c.name)}</strong><br><em>${c.progressPercent}% · ${esc(fmtElapsed(c))}</em></div><div class="time"><strong>${esc(c.arrivalTime||'—')}</strong></div></div>`).join('')}</div></section></div><section class="panel" style="margin-top:16px"><h2>⛰️ Checkpoints</h2><p class="sub">Images use nearby Wikimedia Commons results where available.</p><div class="cards">${d.checkpoints.map(c=>`<article class="card ${c.name===cur?.name?'now':next&&c.name===next.name?'next':''}"><div class="img"><img src="${esc(S.imgs[c.name]||FALL)}" alt="${esc(c.name)}"></div><div class="body"><h3>${esc(c.name)}</h3><div class="stats"><div class="stat"><small>Arrival</small><b>${esc(c.arrivalTime||'—')}</b></div><div class="stat"><small>Elapsed</small><b>${esc(fmtElapsed(c))}</b></div><div class="stat"><small>Route</small><b>${c.progressPercent}%</b></div></div></div></article>`).join('')}</div></section><footer>Source: Ten Tors Route I event data. JSON generated by GitHub Actions. Page ${APP_VERSION}. Coordinates are approximate for visualisation and image lookup.</footer></main>`}
window.load=load;load();setInterval(load,REFRESH);
</script>
</body>
</html>
