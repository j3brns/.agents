<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#052e16"><title>Ten Tors Route I — Polar Explorer Scouts</title><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f8fafc;background:#020617}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 10%,#065f46 0,transparent 30%),radial-gradient(circle at 85% 5%,#075985 0,transparent 28%),linear-gradient(#020617,#0f172a 50%,#052e16);color:#f8fafc}.wrap{max-width:1180px;margin:auto;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.hero,.panel{border:1px solid rgba(255,255,255,.14);background:rgba(15,23,42,.82);box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(16px)}.hero{border-radius:32px;padding:clamp(20px,5vw,40px);overflow:hidden;position:relative}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(52,211,153,.35),transparent 33%),repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 1px,transparent 1px 18px);pointer-events:none}.hero>*{position:relative}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:end}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.pill{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;display:inline-flex}.good{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.14);color:#d1fae5}.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.13);color:#fef3c7}h1{font-size:clamp(34px,8vw,68px);line-height:.98;letter-spacing:-.055em;margin:0}.lead{font-size:clamp(15px,2.2vw,18px);line-height:1.6;color:#e2e8f0;max-width:720px}.btn{min-height:44px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.1);color:white;padding:11px 16px;font:inherit;font-weight:850}.metrics{display:grid;gap:12px}.metric{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:22px;padding:14px}.metric small{color:#94a3b8;text-transform:uppercase;letter-spacing:.18em;font-weight:900}.metric b{display:block;font-size:21px;margin-top:5px}.metric span{color:#cbd5e1;font-size:12px}.cols{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:16px}.panel{border-radius:28px;padding:clamp(16px,3vw,24px)}h2{margin:0 0 5px}.sub{color:#94a3b8;margin:0 0 16px}.map{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:radial-gradient(circle at 30% 25%,rgba(52,211,153,.2),transparent 35%),linear-gradient(135deg,#0f172a,#1f2937,#14532d);padding:10px}svg{width:100%;height:auto;display:block}.bar{height:9px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#34d399;width:0;transition:width .6s}.timeline{display:grid;gap:11px}.row{display:grid;grid-template-columns:34px 1fr 58px;gap:9px;align-items:center}.dot{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#94a3b8;font-weight:900}.dot.on{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.7);color:#d1fae5}.row strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row em{font-style:normal;color:#94a3b8;font-size:11px}.time{text-align:right}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px}.card{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:22px;overflow:hidden}.card.now{border-color:rgba(52,211,153,.75)}.card.next{border-color:rgba(125,211,252,.7)}.img{height:132px;background:#111827;position:relative}.img img{width:100%;height:100%;object-fit:cover;opacity:.84}.body{padding:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:14px;padding:8px}.stat small{font-size:8px;color:#94a3b8;text-transform:uppercase;letter-spacing:.12em}.stat b{display:block;font-size:12px}.notice{margin-bottom:16px;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}footer{text-align:center;color:#64748b;font-size:12px;padding:22px}.spin{width:50px;height:50px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#34d399;animation:spin .9s linear infinite;margin:20vh auto 16px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:860px){.grid,.cols{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.hero{border-radius:24px}.metrics,.cards{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 54px}.dot{width:29px;height:29px}.img{height:160px}.stat{padding:7px}}</style></head><body><div id="root"><div class="spin"></div><p style="text-align:center;color:#cbd5e1">Loading Route I…</p></div><script>const SRC='https://www.tentors.org.uk/eventdata/routei.html',TEAM='IF',TEAM_NAME='Polar Explorer Scouts',REFRESH=60000,URLS=[SRC,'https://api.allorigins.win/raw?url='+encodeURIComponent(SRC),'https://corsproxy.io/?'+encodeURIComponent(SRC)],ROUTE=['START','HIGHER TOR','COSDON HILL','SHILSTONE TOR','STEEPERTON TOR','WATERN TOR','SITTAFORD TOR','STANNON TOR','POSTBRIDGE','HIGHER WHITE TOR','HOLMING BEAM','WHITE BARROW','STANDON FARM','WILLSWORTHY','HARE TOR','KITTY TOR','EAST MILL TOR','FINISH'],SNAP='LAST UPDATED: 19:02\nPolar Explorer Scouts IF 07:00 08:00 08:25 09:02 10:40 11:40 12:47 13:33 14:32 15:50 16:58 17:57',CO={START:[50.7379,-4.0068],'HIGHER TOR':[50.7167,-4.0032],'COSDON HILL':[50.6928,-3.9414],'SHILSTONE TOR':[50.6705,-3.9126],'STEEPERTON TOR':[50.6729,-3.9744],'WATERN TOR':[50.6657,-3.9647],'SITTAFORD TOR':[50.6597,-3.9308],'STANNON TOR':[50.6467,-3.9348],POSTBRIDGE:[50.5958,-3.9185],'HIGHER WHITE TOR':[50.5891,-3.9794],'HOLMING BEAM':[50.5723,-4.0115],'WHITE BARROW':[50.5757,-4.0459],'STANDON FARM':[50.6167,-4.0525],WILLSWORTHY:[50.6281,-4.0712],'HARE TOR':[50.6269,-4.0318],'KITTY TOR':[50.6574,-4.0221],'EAST MILL TOR':[50.6903,-4.0105],FINISH:[50.7379,-4.0068]},FALL='https://commons.wikimedia.org/wiki/Special:FilePath/Dartmoor%20view%20from%20Haytor.jpg?width=900';let S={d:null,imgs:{},err:null,mode:'',refresh:null};function e(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function m(t){if(!/^\d{1,2}:\d{2}$/.test(t||''))return null;let[a,b]=t.split(':').map(Number);return a*60+b}function el(a,b){let x=m(a),y=m(b);if(x==null||y==null)return'—';let d=Math.max(0,y-x),h=Math.floor(d/60),mm=d%60;return h?`${h}h ${String(mm).padStart(2,'0')}m`:`${mm}m`}function ago(t){let x=m(t);if(x==null)return'—';let n=new Date(),s=new Date(n);s.setHours(Math.floor(x/60),x%60,0,0);let d=Math.floor((n-s)/60000);if(d<0)return'later today';if(d<1)return'<1m ago';let h=Math.floor(d/60),mm=d%60;return h?`${h}h ${mm}m ago`:`${d}m ago`}function parse(txt){let doc=new DOMParser().parseFromString(txt,'text/html'),body=doc.body?.innerText||txt,lines=body.split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),last=(lines.find(x=>/^LAST UPDATED:/i.test(x))||'LAST UPDATED: unknown').replace(/^LAST UPDATED:\s*/i,''),row=lines.find(x=>new RegExp('\\b'+TEAM+'\\b').test(x)&&/\b\d{1,2}:\d{2}\b/.test(x));if(!row)throw Error('Team code IF not found');let ft=row.search(/\b\d{1,2}:\d{2}\b/),name=(row.slice(0,ft).replace(new RegExp('\\b'+TEAM+'\\s*$'),'').trim()||TEAM_NAME),times=row.match(/\b\d{1,2}:\d{2}\b/g)||[],cps=ROUTE.map((n,i)=>({name:n,time:times[i]||'',hit:!!times[i],elapsed:times[i]?el(times[0],times[i]):'—',pct:Math.round(i/(ROUTE.length-1)*100),co:CO[n]})),rc=cps.filter(x=>x.hit).length;return{last,name,cps,cur:cps[rc-1]||cps[0],next:cps[rc]||null,progress:Math.max(0,Math.round((rc-1)/(ROUTE.length-1)*100))}}async function fetchLive(){let er;for(const u of URLS){try{let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return{txt:await r.text(),mode:u===SRC?'direct':'proxy'}}catch(x){er=x}}throw er}async function load(silent=false){if(!silent)document.getElementById('root').innerHTML='<div class="spin"></div><p style="text-align:center;color:#cbd5e1">Loading Route I…</p>';try{let r=await fetchLive();S.d=parse(r.txt);S.mode=r.mode;S.err=null}catch(x){S.d=parse(SNAP);S.mode='fallback snapshot';S.err='Live refresh is blocked here, so this view is using an embedded snapshot.'}S.refresh=new Date();render();imgs()}async function img(cp){if(S.imgs[cp])return;let c=CO[cp],p=new URLSearchParams({action:'query',generator:'geosearch',ggscoord:c[0]+'|'+c[1],ggsradius:'6000',ggslimit:'6',prop:'pageimages',pithumbsize:'700',format:'json',origin:'*'});try{let r=await fetch('https://commons.wikimedia.org/w/api.php?'+p),j=await r.json(),pg=Object.values(j?.query?.pages||{});S.imgs[cp]=pg.find(x=>x.thumbnail)?.thumbnail.source||FALL}catch{S.imgs[cp]=FALL}}async function imgs(){await Promise.all(ROUTE.map(img));render()}function pill(t,c=''){return`<span class="pill ${c}">${e(t)}</span>`}function metric(l,v,d){return`<div class="metric"><small>${e(l)}</small><b>${e(v)}</b><span>${e(d)}</span></div>`}function map(cps){let lat=cps.map(x=>x.co[0]),lon=cps.map(x=>x.co[1]),mnla=Math.min(...lat),mxla=Math.max(...lat),mnlo=Math.min(...lon),mxlo=Math.max(...lon),pts=cps.map(x=>({...x,x:8+(x.co[1]-mnlo)/(mxlo-mnlo)*84,y:92-(x.co[0]-mnla)/(mxla-mnla)*84})),p=pts.map(x=>`${x.x},${x.y}`).join(' '),rp=pts.filter(x=>x.hit).map(x=>`${x.x},${x.y}`).join(' ');return`<div class="map"><svg viewBox="0 0 100 100"><polyline points="${p}" fill="none" stroke="rgba(226,232,240,.35)" stroke-width="1.5" stroke-dasharray="2 2"/><polyline points="${rp}" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>${pts.map((x,i)=>`<g><circle cx="${x.x}" cy="${x.y}" r="${x.name===S.d.cur.name?2.5:1.5}" fill="${x.hit?'#34d399':'#cbd5e1'}" stroke="#020617" stroke-width=".6"/>${(i==0||i==pts.length-1||x.name===S.d.cur.name)?`<text x="${x.x+2}" y="${x.y-2}" font-size="2.5" fill="white" font-weight="800">${e(x.name)}</text>`:''}</g>`).join('')}</svg></div>`}function render(){let d=S.d,lr=S.refresh?S.refresh.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';document.getElementById('root').innerHTML=`<main class="wrap">${S.err?`<section class="panel notice"><h2>Connection note</h2><p class="sub">${e(S.err)} Mode: ${e(S.mode)}.</p></section>`:''}<section class="hero"><div class="grid"><div><div class="pills">${pill('Route I live tracker','good')}${pill('Code IF')}${pill('Mode: '+S.mode,S.mode.includes('fallback')?'warn':'good')}${pill('Source updated '+d.last)}</div><h1>${e(d.name)} across Dartmoor</h1><p class="lead">Mobile-focused dashboard for Polar Explorer Scouts, team code IF. It refreshes every 60 seconds and falls back gracefully if the live source is blocked.</p><p><button class="btn" onclick="load(true)">⟳ Refresh now</button> ${pill('Auto refresh every 60s')}</p></div><div class="metrics">${metric('Current position',d.cur.name,d.cur.time?'Arrived '+d.cur.time:'No checkpoint yet')}${metric('Next checkpoint',d.next?d.next.name:'Finish reached',d.next?d.next.pct+'% route marker':'Route complete')}${metric('Since last checkpoint',ago(d.cur.time),'Calculated locally')}${metric('Last dashboard refresh',lr,'Browser fetch time')}</div></div></section><div class="cols"><section class="panel"><h2>🧭 Stylised Route I map</h2><p class="sub">Coordinate-projected path, not a navigation map.</p>${map(d.cps)}</section><section class="panel"><h2>📍 Progress timeline</h2><p class="sub">${d.progress}% complete by checkpoint count.</p><div class="bar"><i style="width:${d.progress}%"></i></div><div class="timeline" style="margin-top:16px">${d.cps.map((c,i)=>`<div class="row"><div class="dot ${c.hit?'on':''}">${c.hit?'✓':i+1}</div><div><strong>${e(c.name)}</strong><br><em>${c.pct}% · ${e(c.elapsed)}</em></div><div class="time"><strong>${e(c.time||'—')}</strong></div></div>`).join('')}</div></section></div><section class="panel" style="margin-top:16px"><h2>⛰️ Checkpoints</h2><p class="sub">Images use nearby Wikimedia Commons results where available.</p><div class="cards">${d.cps.map(c=>`<article class="card ${c.name===d.cur.name?'now':d.next&&c.name===d.next.name?'next':''}"><div class="img"><img src="${e(S.imgs[c.name]||FALL)}" alt="${e(c.name)}"></div><div class="body"><h3>${e(c.name)}</h3><div class="stats"><div class="stat"><small>Arrival</small><b>${e(c.time||'—')}</b></div><div class="stat"><small>Elapsed</small><b>${e(c.elapsed)}</b></div><div class="stat"><small>Route</small><b>${c.pct}%</b></div></div></div></article>`).join('')}</div></section><footer>Source: Ten Tors Route I event data. Coordinates are approximate for visualisation and image lookup.</footer></main>`}window.load=load;load();setInterval(()=>load(true),REFRESH);</script></body></html>
