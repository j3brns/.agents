<!doctype html>
<!-- Ten Tors Route I dashboard v0.4.6: embedded 960px WebP hero -->
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#052e16">
  <title>Ten Tors Route I — Joanna B</title>
  <style>
    :root {
      --bg:#020617;--panel:rgba(15,23,42,.84);--line:rgba(255,255,255,.14);
      --text:#f8fafc;--muted:#94a3b8;--soft:#cbd5e1;--green:#34d399;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);background:var(--bg);
    }
    *{box-sizing:border-box} body{margin:0;min-height:100svh;background:radial-gradient(circle at 20% 10%,#065f46,transparent 30%),radial-gradient(circle at 85% 5%,#075985,transparent 28%),linear-gradient(#020617,#0f172a 50%,#052e16)}
    .wrap{max-width:1180px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}
    .hero,.panel,.metric,.current{border:1px solid var(--line);background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.32);backdrop-filter:blur(16px)}
    .hero{border-radius:32px;overflow:hidden}
    .heroArt{position:relative;min-height:320px;background:#0f172a}
    .heroArt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center;image-rendering:auto}
    .heroText{position:relative;z-index:2;margin-left:auto;max-width:480px;min-height:320px;display:flex;flex-direction:column;justify-content:end;padding:26px;text-align:right;background:linear-gradient(90deg,transparent,rgba(255,255,255,.76));color:#0f172a}
    .heroText h1{font-size:clamp(42px,9vw,76px);line-height:.9;letter-spacing:-.055em;margin:0}
    .heroText p{margin:10px 0 0;color:#334155}
    .pill{display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#e2e8f0;margin:0 6px 8px 0}
    .heroText .pill{background:rgba(15,23,42,.08);border-color:rgba(15,23,42,.18);color:#0f172a}
    .good{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.16);color:#d1fae5} .heroText .good{color:#065f46}
    .warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.16);color:#92400e}
    .btn{min-height:44px;border:1px solid rgba(15,23,42,.18);border-radius:999px;background:rgba(15,23,42,.10);color:#0f172a;padding:11px 16px;font:inherit;font-weight:850}
    .metricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
    .metric{border-radius:22px;padding:14px}
    .metric small,.stat small,.current small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:900;font-size:10px}
    .metric b{display:block;font-size:21px;margin-top:5px} .metric span{color:var(--soft);font-size:12px}
    .panel{border-radius:28px;padding:clamp(16px,3vw,24px);margin-top:16px}
    h2{margin:0 0 5px} .sub{color:var(--muted);margin:0 0 16px}
    .map{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:radial-gradient(circle at 30% 25%,rgba(52,211,153,.2),transparent 35%),linear-gradient(135deg,#0f172a,#1f2937,#14532d);padding:10px}
    svg{width:100%;height:auto}
    .current{margin-top:16px;border-radius:28px;padding:18px;display:grid;grid-template-columns:1fr repeat(3,auto);gap:16px;align-items:center;background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(255,255,255,.06));border-color:rgba(52,211,153,.35)}
    .current h2{font-size:clamp(28px,6vw,44px);margin:0} .current b{font-size:18px}
    .bar{height:9px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden} .bar i{display:block;height:100%;background:var(--green)}
    .timeline{display:grid;gap:11px;margin-top:16px} .row{display:grid;grid-template-columns:34px 1fr 58px;gap:9px;align-items:center} .row.currentRow{display:none}
    .dot{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:var(--muted);font-weight:900} .dot.on{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.7);color:#d1fae5}
    .row strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .row em{font-style:normal;color:var(--muted);font-size:11px} .time{text-align:right}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:13px} .card{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:22px;overflow:hidden} .card.now{border-color:rgba(52,211,153,.75)} .card.next{border-color:rgba(125,211,252,.7)}
    .img{height:132px;background:linear-gradient(135deg,#0f172a,#14532d);overflow:hidden} .img img{width:100%;height:100%;object-fit:cover;opacity:.84} .body{padding:13px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px} .stat{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:14px;padding:8px} .stat b{font-size:12px}
    .notice{margin-bottom:16px;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)} footer{text-align:center;color:#64748b;font-size:12px;padding:22px}
    .spin{width:50px;height:50px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--green);animation:spin .9s linear infinite;margin:20vh auto 16px} @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:860px){.metricGrid{grid-template-columns:repeat(2,1fr)}.current{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.heroText{text-align:left;margin:0;max-width:none;background:linear-gradient(0deg,rgba(255,255,255,.78),transparent)}}
    @media(max-width:560px){.hero,.panel,.current{border-radius:24px}.heroArt,.heroText{min-height:420px}.metricGrid,.current,.cards{grid-template-columns:1fr}.row{grid-template-columns:30px 1fr 54px}.dot{width:29px;height:29px}.img{height:160px}}
  </style>
</head>

let S={d:null,err:null,checked:null,updating:false};
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function mins(t){if(!/^\d{1,2}:\d{2}$/.test(t||''))return null;let[a,b]=t.split(':').map(Number);return a*60+b}
function fmtElapsed(c){if(c?.elapsed?.label)return c.elapsed.label;let start=S.d?.checkpoints?.[0]?.arrivalTime,a=mins(start),b=mins(c?.arrivalTime);if(a==null||b==null)return'—';let d=Math.max(0,b-a),h=Math.floor(d/60),m=d%60;return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`}
function ago(t){let x=mins(t);if(x==null)return'—';let n=new Date(),s=new Date(n);s.setHours(Math.floor(x/60),x%60,0,0);let d=Math.floor((n-s)/60000);if(d<0)return'later today';if(d<1)return'<1m ago';let h=Math.floor(d/60),m=d%60;return h?`${h}h ${m}m ago`:`${d}m ago`}
async function load(){if(S.updating)return;S.updating=true;if(S.d)render();try{let r=await fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);S.d=await r.json();S.err=null}catch(x){S.err='Could not load generated data.json: '+x.message}finally{S.checked=new Date();S.updating=false;render()}}

function pill(t,c=''){return`<span class="pill ${c}">${esc(t)}</span>`}
function metric(l,v,d){return`<div class="metric"><small>${esc(l)}</small><b>${esc(v)}</b><span>${esc(d)}</span></div>`}
function mapSvg(cps){let lat=cps.map(x=>x.coordinates.lat),lon=cps.map(x=>x.coordinates.lon),mnla=Math.min(...lat),mxla=Math.max(...lat),mnlo=Math.min(...lon),mxlo=Math.max(...lon),cur=S.d.currentCheckpoint?.name,pts=cps.map(x=>({...x,x:8+(x.coordinates.lon-mnlo)/(mxlo-mnlo||1)*84,y:92-(x.coordinates.lat-mnla)/(mxla-mnla||1)*84})),p=pts.map(x=>`${x.x},${x.y}`).join(' '),rp=pts.filter(x=>x.reached).map(x=>`${x.x},${x.y}`).join(' ');return`<div class="map"><svg viewBox="0 0 100 100"><polyline points="${p}" fill="none" stroke="rgba(226,232,240,.35)" stroke-width="1.5" stroke-dasharray="2 2"/><polyline points="${rp}" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>${pts.map((x,i)=>`<g><circle cx="${x.x}" cy="${x.y}" r="${x.name===cur?2.5:1.5}" fill="${x.reached?'#34d399':'#cbd5e1'}" stroke="#020617" stroke-width=".6"/>${(i===0||i===pts.length-1||x.name===cur)?`<text x="${x.x+2}" y="${x.y-2}" font-size="2.5" fill="white" font-weight="800">${esc(x.name)}</text>`:''}</g>`).join('')}</svg></div>`}
function render(){

  let d=S.d,cur=d.currentCheckpoint,next=d.nextCheckpoint,checked=S.checked?S.checked.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—',gen=d.generatedAt?new Date(d.generatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';

nt}% · ${esc(fmtElapsed(c))}</em></div><div class="time"><strong>${esc(c.arrivalTime||'—')}</strong></div></div>`).join('')}</div></section><section class="panel"><h2>⛰️ Checkpoints</h2><p class="sub">Images are supplied by data.json where available, with an embedded fallback.</p><div class="cards">${d.checkpoints.map(c=>`<article class="card ${c.name===cur?.name?'now':next&&c.name===next.name?'next':''}"><div class="img"><img src="${esc(imageUrl(c))}" alt="" loading="lazy" onerror="this.onerror=null;this.src=FALL"></div><div class="body"><h3>${esc(c.name)}</h3><div class="stats"><div class="stat"><small>Arrival</small><b>${esc(c.arrivalTime||'—')}</b></div><div class="stat"><small>Elapsed</small><b>${esc(fmtElapsed(c))}</b></div><div class="stat"><small>Route</small><b>${c.progressPercent}%</b></div></div></div></article>`).join('')}</div></section><footer>Source: Ten Tors Route I event data. JSON generated by GitHub Actions. Page ${APP_VERSION}. Hero: embedded 960px WebP base64.</footer></main>`
